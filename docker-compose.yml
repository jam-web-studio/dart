# Державне агентство розвитку туризму України: cp api/.env.docker.example api/.env && docker compose up -d --build
# Сайт — http://<сервер>:8095/, адмінка — http://<сервер>:8095/admin
# Імена сервісів з префіксом md-, бо на живому сервері вебсервер підключено ще й до мережі музейного порталу.
services:
  tg-app:                    # Laravel 13 + Filament (PHP-FPM): API й адмінка
    build: ./api
    image: tourism-gov-app:latest  # на живому сервері образ збирає GitHub Actions
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      RUN_MIGRATIONS: "1"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - storage:/var/www/html/storage/app
      - public:/var/www/public-shared
    depends_on:
      tg-db: { condition: service_healthy }

  tg-site:                # Next.js SSR
    build: ./web
    image: tourism-gov-web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL: http://tg-web:8081/api
      NEXT_PUBLIC_API_BASE: ${SITE_URL:-http://localhost:8095}/api
      SITE_URL: ${SITE_URL:-http://localhost:8095}
      INDEXABLE: ${INDEXABLE:-auto}
    depends_on: [tg-app]

  tg-web:                    # nginx: сайт, /api, /admin, файли
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8095}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage/app:ro
    depends_on: [tg-app, tg-site]

  tg-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tourism
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism"]
      interval: 5s
      retries: 20

volumes:
  storage:
  public:
  dbdata:
