# Один домен для всього: сайт (Next.js) на «/», API, адмінка й файли — Laravel.
# Next.js під час рендерингу ходить до Laravel через внутрішній сервер :8081.

upstream site { server tg-site:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 60M;
    root /var/www/html/public;

    location ^~ /storage/ { alias /var/www/html/storage/app/public/; expires 30d; add_header Cache-Control "public"; }
    # Filament і його ресурси, Livewire, API, логотипи адмінки
    location ~ ^/(admin|livewire[^/]*|filament|css/filament|js/filament|fonts/filament|vendor|api|logo\.svg|logo-white\.svg|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        fastcgi_pass tg-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300;
    }

    # Усе інше — публічний сайт
    location / {
        proxy_pass http://site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Внутрішній API для Next.js (не публікується назовні)
server {
    listen 8081;
    server_name _;
    root /var/www/html/public;
    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
        fastcgi_pass tg-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 120;
    }
}
